name: Production RAG Evaluation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy plotly requests python-dotenv

      - name: Run unit & integration test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Verify full 192-configuration ablation benchmark & report generation
        run: |
          python run_benchmark.py --mode offline
